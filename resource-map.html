    updateVisiblePlaces();
  }

  function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
    if (lat1 === undefined || lon1 === undefined || lat2 === undefined || lon2 === undefined) return 0;
    const R = 3958.8; // Radius of the Earth in miles
    const toRad = deg => (deg * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    const dist = R * c;
    return isNaN(dist) ? 0 : dist;
  }

  // BOTTOM SHEET: drag / flick between peek (title only), half (the chosen place) and full (whole list)
  const placesSheet = {
    state: 'peek',      // 'peek' | 'half' | 'full'
    y: 0,               // current translateY in px (0 = fully open)
    snaps: { full: 0, half: 0, peek: 0 },
    suppressClick: false
  };

  function sheetEls() {
    return {
      sheet: document.getElementById('bottom-drawer-sheet'),
      header: document.getElementById('drawer-header'),
      body: document.getElementById('sheet-body'),
      card: document.getElementById('place-focus-card'),
      main: document.querySelector('.rm-main'),
      top: document.querySelector('.rm-top')
    };
  }

  // Size the sheet to the space under the top controls and work out the three resting points
  function measurePlacesSheet() {
    const { sheet, header, card, main, top } = sheetEls();
    if (!sheet || !main) return;
    const topSpace = top ? top.offsetHeight + 8 : 120;
    const height = Math.max(240, main.clientHeight - topSpace);
    sheet.style.height = `${height}px`;
    const headerH = header ? header.offsetHeight : 64;
    const cardH = (card && !card.classList.contains('hidden')) ? card.offsetHeight : 0;
    const peek = Math.max(0, height - headerH);
    const halfVisible = Math.min(height * 0.62, headerH + cardH);
    placesSheet.snaps = {
      full: 0,
      half: Math.min(peek, Math.max(0, height - halfVisible)),
      peek
    };
  }

  function setSheetY(y) {
    const { sheet } = sheetEls();
    if (!sheet) return;
    placesSheet.y = y;
    sheet.style.setProperty('--sheet-y', `${y}px`);
    // map buttons only make sense while the map is mostly visible
    sheet.classList.toggle('fabs-hidden', y < placesSheet.snaps.half - 40);
  }

  function snapPlacesSheet(state, { animate = true } = {}) {
    const { sheet, header, body } = sheetEls();
    if (!sheet) return;
    measurePlacesSheet();
    placesSheet.state = state;
    isDrawerExpanded = state === 'full';
    if (!animate) sheet.classList.add('is-dragging');
    setSheetY(placesSheet.snaps[state]);
    if (!animate) requestAnimationFrame(() => sheet.classList.remove('is-dragging'));
    sheet.classList.toggle('is-full', state === 'full');
    sheet.classList.toggle('expanded', state === 'full');
    sheet.dataset.state = state;
    if (header) header.setAttribute('aria-expanded', state === 'full' ? 'true' : 'false');
    if (body && state !== 'full') body.scrollTop = 0;
  }
  window.snapPlacesSheet = snapPlacesSheet;

  // Kept for existing callers: true opens the full list, false shows the chosen place (or peek), no arg toggles
  function toggleBottomDrawer(forceState) {
    const collapsedState = (currentFocusId || lastFilteredCount === 0) ? 'half' : 'peek';
    if (typeof forceState === 'boolean') {
      snapPlacesSheet(forceState ? 'full' : collapsedState);
    } else {
      snapPlacesSheet(placesSheet.state === 'full' ? collapsedState : 'full');
    }
  }

  function initPlacesSheet() {
    const { sheet, header, body, card } = sheetEls();
    if (!sheet || sheet.dataset.dragReady) return;
    sheet.dataset.dragReady = '1';

    let startY = 0, startSheetY = 0, dragging = false, tracking = false, pointerId = null;
    let lastY = 0, lastT = 0, velocity = 0;

    const onDown = (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      // In the full list, let the list scroll normally unless the drag starts on the header
      if (placesSheet.state === 'full' && !header.contains(e.target) && body.scrollTop > 0) return;
      tracking = true;
      dragging = false;
      pointerId = e.pointerId;
      startY = lastY = e.clientY;
      lastT = performance.now();
      startSheetY = placesSheet.y;
      velocity = 0;
    };

    const onMove = (e) => {
      if (!tracking || e.pointerId !== pointerId) return;
      const dy = e.clientY - startY;
      if (!dragging) {
        if (Math.abs(dy) < 6) return;
        // Pushing up inside the full list is a scroll, not a drag
        if (placesSheet.state === 'full' && !header.contains(e.target) && dy < 0) { tracking = false; return; }
        dragging = true;
        sheet.classList.add('is-dragging');
        try { sheet.setPointerCapture(pointerId); } catch (_) {}
      }
      const { full, peek } = placesSheet.snaps;
      let y = startSheetY + dy;
      // gentle resistance past the ends
      if (y < full) y = full - Math.sqrt(full - y) * 4;
      if (y > peek) y = peek + Math.sqrt(y - peek) * 4;
      setSheetY(y);
      const now = performance.now();
      const dt = Math.max(1, now - lastT);
      velocity = 0.8 * ((e.clientY - lastY) / dt) + 0.2 * velocity;
      lastY = e.clientY;
      lastT = now;
      e.preventDefault();
    };

    const onUp = (e) => {
      if (!tracking || (e.pointerId !== undefined && e.pointerId !== pointerId)) return;
      tracking = false;
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove('is-dragging');
      try { sheet.releasePointerCapture(pointerId); } catch (_) {}
      placesSheet.suppressClick = true;
      setTimeout(() => { placesSheet.suppressClick = false; }, 0);

      // Project where a flick would land, then rest at the closest point
      const projected = placesSheet.y + velocity * 180;
      const order = (currentFocusId || lastFilteredCount === 0) ? ['full', 'half', 'peek'] : ['full', 'peek'];
      let best = order[0];
      order.forEach(k => {
        if (Math.abs(placesSheet.snaps[k] - projected) < Math.abs(placesSheet.snaps[best] - projected)) best = k;
      });
      if (best === 'peek' && focusedPlaceId) {
        clearFocusedPlace();
        return;
      }
      snapPlacesSheet(best);
    };

    sheet.addEventListener('pointerdown', onDown);
    // Follow the pointer everywhere once a press starts on the sheet (a mouse can leave it before the drag grabs)
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    // A drag must not also count as a tap on whatever was under the finger
    sheet.addEventListener('click', (e) => {
      if (placesSheet.suppressClick) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    // Keyboard: arrow keys on the header move between the three positions
    header.addEventListener('keydown', (e) => {
      const order = (currentFocusId || lastFilteredCount === 0) ? ['peek', 'half', 'full'] : ['peek', 'full'];
      const i = order.indexOf(placesSheet.state);
      if (e.key === 'ArrowUp' && i < order.length - 1) { e.preventDefault(); snapPlacesSheet(order[i + 1]); }
      if (e.key === 'ArrowDown' && i > 0) { e.preventDefault(); snapPlacesSheet(order[i - 1]); }
    });

    // Re-fit when the chosen place (and so the half height) or the screen size changes
    if (card && window.ResizeObserver) {
      new ResizeObserver(() => { if (!dragging) snapPlacesSheet(placesSheet.state); }).observe(card);
    }
    window.addEventListener('resize', () => snapPlacesSheet(placesSheet.state, { animate: false }));

    snapPlacesSheet('peek', { animate: false });
  }

  // How much of the map the sheet currently covers
  function sheetVisibleHeight() {
    const { sheet } = sheetEls();
    if (!sheet) return 240;
    return Math.max(0, sheet.offsetHeight - placesSheet.y);
  }

  function renderDrawerPlaces(items) {
    const listEl = document.getElementById('places-list') || document.getElementById('drawer-content-list');
    const badgeEl = document.getElementById('drawer-count-badge');
    const titleEl = document.getElementById('drawer-title');
    if (!listEl) return;

    const count = items ? items.length : 0;
    if (badgeEl) {
      badgeEl.textContent = count;
    }
    if (titleEl) {
      titleEl.textContent = mapSearchQuery
        ? `Results for “${mapSearchQuery}”`
        : activeMapMode === 'saved'
          ? 'Saved places'
          : effectiveRadiusMiles > activeRadiusMiles
            ? `Places within ${effectiveRadiusMiles} mi · few closer than ${activeRadiusMiles}`
            : `Places within ${effectiveRadiusMiles} mi`;
    }

    if (!items || items.length === 0) {
      listEl.innerHTML = `
        <div class="ns-empty">
          <p class="ns-empty__title">${activeMapMode === 'saved' ? 'No saved places here' : 'No places found'}</p>
          <p class="ns-empty__sub">${activeMapMode === 'saved' ? 'Tap the bookmark on a place to save it.' : 'Try a longer distance, or change your filters.'}</p>
        </div>
      `;
      renderFocusCard(null);
      return;
    }

    const refCoords = getActiveReferenceCoords();

    const sorted = [...items].map(pin => {
      const dist = pin.distanceMiles !== undefined ? pin.distanceMiles : (hasPin(pin) ? calculateDistanceMiles(refCoords.lat, refCoords.lng, pin.lat, pin.lng) : NaN);
      return { ...pin, distanceMiles: dist };
    }).sort((a, b) => (Number.isFinite(a.distanceMiles) ? a.distanceMiles : 1e9) - (Number.isFinite(b.distanceMiles) ? b.distanceMiles : 1e9));

    const focusRes = currentFocusId ? (sorted.find(r => String(r.id) === currentFocusId) || null) : null;
    renderFocusCard(focusRes);

    listEl.innerHTML = sorted.map((res) => {
      const meta = categoryMeta(res.category);
      const st = placeStatus(res);
      const isSaved = isPlaceSaved(res.id);
      const who = res.population && !/^(all|public|anyone)\b/i.test(res.population) ? res.population : '';
      const sub = [
        hasPin(res) ? esc(formatMiles(res.distanceMiles)) : 'Call for location',
        st.open === true ? '<span class="text-leaf font-semibold">Open now</span>' : st.open === null ? 'Call first' : esc(st.text || 'Closed'),
        res.referralOnly ? 'Referral only' : '',
        who ? esc(who.length > 32 ? who.slice(0, 30) + '…' : who) : ''
      ].filter(Boolean).join(' · ');

      return `
        <div class="ns-row place-card">
          <button type="button" class="flex items-center gap-4 flex-1 min-w-0 text-left" onclick="selectAndFocusPlace('${jsArg(res.id)}', ${Number(res.lat)}, ${Number(res.lng)})" aria-label="Show ${esc(res.name)} on the map">
            <span class="ns-tile"><span class="material-symbols-outlined">${meta.icon}</span></span>
            <span class="ns-row__body">
              <span class="ns-row__title block truncate">${esc(res.name)}</span>
              <span class="ns-row__sub block">${sub}</span>
            </span>
          </button>
          <button type="button" class="ns-icon-btn ns-icon-btn--sm" onclick="toggleSavePlace('${jsArg(res.id)}', event)" aria-pressed="${isSaved}" aria-label="${isSaved ? 'Remove from saved' : 'Save this place'}" style="box-shadow:none;border:1px solid var(--line)">
            <span class="material-symbols-outlined ${isSaved ? 'ms-fill' : ''}" style="${isSaved ? 'color:var(--ink)' : ''}">bookmark</span>
          </button>
        </div>
      `;
    }).join('');
  }


  function focusResourceFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      const resourceId = params.get('resource');

      if (!resourceId || !map) return false;

      // One-time deep link: forget the parameter right away so the re-renders below
      // (filters relaxing, radius growing) don't schedule this focus again and again.
      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('resource');
      window.history.replaceState({}, '', cleanUrl.pathname + cleanUrl.search);

      const resources = getResourcesData();
      const wanted = String(resolvePlaceId(resourceId));
      const resource = resources.find(r => String(r.id) === wanted);

      if (!resource) return false;

      // No map pin (private address): open its card in the list
      if (!hasPin(resource)) {
        revealPlace(resource);
        focusedPlaceId = wanted;
        applyCombinedFilters();
        if (typeof snapPlacesSheet === 'function') snapPlacesSheet('half');
        return true;
      }

      const refCoords = getActiveReferenceCoords();
      const distanceMiles = calculateDistanceMiles(
        refCoords.lat,
        refCoords.lng,
        resource.lat,
        resource.lng
      );

      // Expand only enough to make this resource eligible/visible.
      // This happens once when arriving from the chatbot.
      if (Number.isFinite(distanceMiles) && distanceMiles > effectiveRadiusMiles) {
        if (distanceMiles <= 10) {
          activeRadiusMiles = 10;
        } else if (distanceMiles <= 25) {
          activeRadiusMiles = 25;
        } else {
          activeRadiusMiles = Math.ceil(distanceMiles + 1);
        }

        if (typeof updateVisiblePlaces === 'function') {
          updateVisiblePlaces();
        }
      }

      let targetMarker = mapMarkers.find(
        m => String(m.resId) === wanted
      );

      // If a filter hides the linked place, relax just that filter once
      if (!targetMarker) {
        revealPlace(resource);
        targetMarker = mapMarkers.find(m => String(m.resId) === wanted);
      }

      if (!targetMarker || !targetMarker.marker) {
        return false;
      }

      selectAndFocusPlace(
        resource.id,
        resource.lat,
        resource.lng,
        true
      );

      return true;

    } catch (err) {
      console.warn('[NorthStar Map] Deep-link focus failed:', err);
      return false;
    }
  }

  window.focusResourceFromUrl = focusResourceFromUrl;

  // Turn off only the filters that would hide this place
  function revealPlace(resource) {
    if (!resource) return;
    if (activeMapMode === 'saved' && !isPlaceSaved(resource.id)) {
      switchMapMode('nearby');
    }
    if (!activeSelectedCategories.includes('all') && !placeInCategories(resource, activeSelectedCategories)) {
      toggleCategoryFilter('all');
    }
    if (activeScopeFilter === 'verified' && resource.verifiedOnly !== true) {
      setScopeFilter('everyone');
    }
    if (isOpenNowFilterActive && !isPlaceOpenNow(resource) && !(resource.hoursKnown === false && !resource.closedNote)) {
      toggleOpenNowFilter();
    }
  }

  // Keep fitted content clear of the floating controls and the bottom sheet
  function mapFitPadding() {
    const top = document.querySelector('.rm-top');
    const sheet = document.getElementById('bottom-drawer-sheet');
    return {
      paddingTopLeft: [24, (top ? top.offsetHeight : 120) + 12],
      paddingBottomRight: [24, sheetVisibleHeight() + 24]
    };
  }

  function selectAndFocusPlace(resId, lat, lng, autoOpenPopup = false) {
    if (!map) return;
    if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng)) || lat === null) {
      focusPlaceInSheet(resId);
      return;
    }

    window.northstarSelectedMapResourceId = String(resId);
    focusedPlaceId = String(resId);

    // Prevent moveend/zoomend from rebuilding all markers while
    // this one-time chatbot/map focus is happening.
    window.northstarProgrammaticMapFocus = true;

    map.flyTo([lat, lng], 16, {
      animate: true,
      duration: 0.8
    });

    setTimeout(() => {
      const targetMarker = mapMarkers.find(
        m => String(m.resId) === String(resId)
      );

      // Details for the place now live in the bottom sheet (no popup)
      if (targetMarker && targetMarker.marker && autoOpenPopup) {
        applyCombinedFilters();
      }

      // The one-time View on Map focus is now finished.
      window.northstarProgrammaticMapFocus = false;
    }, 1000);

    applyCombinedFilters();
    snapPlacesSheet('half');
  }

  // Tapping a pin: show it in the bottom sheet without zooming in
  function focusPlaceInSheet(resId) {
    focusedPlaceId = String(resId);
    applyCombinedFilters();
    snapPlacesSheet('half');
  }
  window.focusPlaceInSheet = focusPlaceInSheet;
  window.selectAndFocusPlace = selectAndFocusPlace;

  let currentTransitRouteData = null;
  let currentTransitDest = null;
  let mapRouteLayerGroup = null;

  function decodePolyline(encoded) {
    if (!encoded) return [];
    let points = [];
    let index = 0, len = encoded.length;
    let lat = 0, lng = 0;
    while (index < len) {
      let b, shift = 0, result = 0;
      do {
        b = encoded.charCodeAt(index++) - 63;
        result |= (b & 0x1f) << shift;
        shift += 5;
      } while (b >= 0x20);
      let dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
      lat += dlat;
      shift = 0;
      result = 0;
      do {
        b = encoded.charCodeAt(index++) - 63;
        result |= (b & 0x1f) << shift;
        shift += 5;
      } while (b >= 0x20);
      let dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
      lng += dlng;
      points.push([lat / 1e5, lng / 1e5]);
    }
    return points;
  }

  function clearActiveRouteOnMap() {
    if (mapRouteLayerGroup) {
      mapRouteLayerGroup.clearLayers();
      if (map) map.removeLayer(mapRouteLayerGroup);
      mapRouteLayerGroup = null;
    }
  }

  function drawRouteOnMapAndClose() {
    closeTransitModal();
    if (!map || !currentTransitRouteData || !currentTransitRouteData.steps) return;

    clearActiveRouteOnMap();
    mapRouteLayerGroup = L.layerGroup().addTo(map);

    const boundsPoints = [];
    let transitStopNum = 1;

    currentTransitRouteData.steps.forEach((step, idx) => {
      let decodedPts = decodePolyline(step.polyline);
      if (!decodedPts.length && step.start_location && step.end_location) {
        decodedPts = [
          [step.start_location.lat, step.start_location.lng],
          [step.end_location.lat, step.end_location.lng]
        ];
      }

      if (decodedPts.length > 0) {
        boundsPoints.push(...decodedPts);

        if (step.travel_mode === 'TRANSIT') {
          // Solid ink line for the bus ride
          L.polyline(decodedPts, {
            color: '#111111',
            className: 'ns-ink-line',
            weight: 6,
            opacity: 0.9,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(mapRouteLayerGroup);

          // Add Bus Stop Markers
          if (step.transit) {
            if (step.transit.departure_location) {
              const stopIcon = L.divIcon({
                className: 'bus-stop-numbered-icon',
                html: `<div class="rm-stop">${transitStopNum}</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
              });
              L.marker([step.transit.departure_location.lat, step.transit.departure_location.lng], { icon: stopIcon })
               .bindTooltip(esc(`Stop ${transitStopNum}: get on bus ${step.transit.line_name} at ${step.transit.departure_stop}`), { permanent: false })
               .addTo(mapRouteLayerGroup);
              
              transitStopNum++;
            }
          }
        } else {
          // Dashed amber line for walking
          L.polyline(decodedPts, {
            color: '#111111',
            className: 'ns-ink-line',
            weight: 5,
            opacity: 0.85,
            dashArray: '6, 8',
            lineCap: 'round'
          }).addTo(mapRouteLayerGroup);
        }
      }
    });

    if (boundsPoints.length > 0) {
      map.fitBounds(boundsPoints, Object.assign({ maxZoom: 16 }, mapFitPadding()));
    }
  }

  // ---- Directions sources ----
  // 1. Our server (/api/transit-directions, Google): bus + walk, or walking.
  // 2. If that can't be reached or finds nothing: a free OpenStreetMap walking route
  //    (routing.openstreetmap.de, no key), so people always get a way there.
  async function fetchServerDirections(originStr, destStr, mode) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const resp = await fetch(`/api/transit-directions?origin=${encodeURIComponent(originStr)}&destination=${encodeURIComponent(destStr)}&mode=${mode === 'walking' ? 'walking' : 'transit'}`, { signal: controller.signal });
      const type = resp.headers.get('content-type') || '';
      if (!type.includes('json')) throw new Error(`directions service returned ${resp.status}`);
      const data = await resp.json();
      if (data.success && Array.isArray(data.steps) && data.steps.length) return data;
      throw new Error(data.error || 'no route');
    } finally {
      clearTimeout(timer);
    }
  }

  function fmtWalkDuration(sec) {
    const mins = Math.max(1, Math.round(sec / 60));
    if (mins < 60) return `${mins} min${mins === 1 ? '' : 's'}`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return `${h} hr${h === 1 ? '' : 's'}${m ? ` ${m} min` : ''}`;
  }

  function fmtWalkDistance(meters) {
    const miles = meters / 1609.34;
    return miles < 0.1 ? `${Math.round(meters * 3.281)} ft` : `${miles.toFixed(1)} mi`;
  }

  function osmStepText(step) {
    const m = step.maneuver || {};
    const road = step.name ? ` on ${step.name}` : '';
    const onto = step.name ? ` onto ${step.name}` : '';
    const dir = m.modifier ? m.modifier.replace('sharp ', 'sharp ').replace('slight ', 'slight ') : '';
    switch (m.type) {
      case 'depart': return `Start walking${road}`;
      case 'arrive': return 'You have arrived';
      case 'turn': case 'end of road': case 'fork':
        return dir === 'straight' ? `Keep going${road}` : `Turn ${dir}${onto}`;
      case 'roundabout': case 'rotary': return `Go around the roundabout${onto}`;
      case 'new name': case 'continue': return `Continue${road}`;
      default: return dir ? `Go ${dir}${onto}` : `Continue${road}`;
    }
  }

  async function fetchOsmWalkingRoute(origin, destLat, destLng) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${origin.lng},${origin.lat};${destLng},${destLat}?overview=full&geometries=polyline&steps=true`;
      const resp = await fetch(url, { signal: controller.signal });
      const data = await resp.json();
      const route = data && data.code === 'Ok' && data.routes && data.routes[0];
      if (!route) throw new Error('no walking route');
      const steps = (route.legs[0].steps || [])
        // skip tiny steps (a few feet) that only add noise
        .filter(st => st.distance >= 25 || (st.maneuver && st.maneuver.type === 'arrive'))
        .map(st => ({
          travel_mode: 'WALKING',
          duration: fmtWalkDuration(st.duration),
          distance: st.distance > 0 ? fmtWalkDistance(st.distance) : '',
          instructions: osmStepText(st),
          polyline: st.geometry || '',
          start_location: st.maneuver && st.maneuver.location ? { lat: st.maneuver.location[1], lng: st.maneuver.location[0] } : null,
          end_location: null
        }));
      return {
        success: true,
        mode_used: 'walking',
        source: 'osm',
        summary: {
          departure_time: null,
          duration: fmtWalkDuration(route.duration),
          distance: fmtWalkDistance(route.distance),
          overview_polyline: route.geometry || ''
        },
        steps
      };
    } finally {
      clearTimeout(timer);
    }
  }

  async function openTransitModal(destName, destAddress, destLat, destLng, mode = 'transit') {
    const modal = document.getElementById('transit-directions-modal');
    const nameEl = document.getElementById('transit-dest-name');
    const addrEl = document.getElementById('transit-dest-address');
    const stepsListEl = document.getElementById('transit-steps-list');
    const durEl = document.getElementById('transit-total-duration');
    const distEl = document.getElementById('transit-total-distance');
    const timeRangeEl = document.getElementById('transit-time-range');

    if (!modal) return;

    currentTransitDest = { destName, destAddress, destLat, destLng, mode };

    // Update travel mode segment
    setPressed(document.getElementById('mode-btn-hybrid'), mode !== 'walking');
    setPressed(document.getElementById('mode-btn-walking'), mode === 'walking');

    const routeBtn = document.getElementById('view-on-map-route-btn');
    if (routeBtn) routeBtn.disabled = true;
    currentTransitRouteData = null;

    nameEl.textContent = destName || 'Directions';
    addrEl.textContent = destAddress || '';
    durEl.textContent = '–';
    distEl.textContent = '';
    timeRangeEl.textContent = '';
    timeRangeEl.classList.add('hidden');

    stepsListEl.innerHTML = `
      <div class="flex flex-col items-center gap-3 py-10" role="status">
        <div class="rm-spinner" aria-hidden="true"></div>
        <p class="text-[14px] font-semibold text-ink-2">Finding a route</p>
      </div>
    `;

    openModal('transit-directions-modal');

    const originCoords = userLocationCoords || { lat: 47.6062, lng: -122.3321 };
    const originStr = `${originCoords.lat},${originCoords.lng}`;
    const destStr = `${destLat},${destLng}`;
    const googleUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destStr)}&travelmode=${mode === 'walking' ? 'walking' : 'transit'}`;
    const fallbackHtml = (title, sub) => `
      <div class="ns-empty mt-2">
        <p class="ns-empty__title">${esc(title)}</p>
        <p class="ns-empty__sub">${esc(sub)}</p>
        <a href="${googleUrl}" target="_blank" rel="noopener" class="ns-btn ns-btn--ghost ns-btn--sm mt-4">
          <span>Open in Google Maps</span><span class="material-symbols-outlined">open_in_new</span>
        </a>
      </div>
    `;

    let data = null;
    let note = '';
    try {
      data = await fetchServerDirections(originStr, destStr, mode);
      if (mode !== 'walking' && data.mode_used === 'walking') note = 'No bus goes there right now, so here’s the walking route.';
    } catch (serverErr) {
      console.warn('Directions service unavailable, trying a walking route:', serverErr);
      try {
        data = await fetchOsmWalkingRoute(originCoords, destLat, destLng);
        note = mode === 'walking' ? '' : 'Bus times aren’t available right now, so here’s the walking route.';
      } catch (walkErr) {
        console.warn('Walking route unavailable too:', walkErr);
        data = null;
      }
    }

    // A newer request (mode switch) may have replaced this one while it loaded
    if (currentTransitDest.destLat !== destLat || currentTransitDest.destLng !== destLng || currentTransitDest.mode !== mode) return;

    try {
      if (data && data.success && data.steps && data.steps.length > 0) {
        currentTransitRouteData = data;
        if (routeBtn) routeBtn.disabled = false;
        durEl.textContent = data.summary.duration || '';
        distEl.textContent = data.summary.distance || '';
        const leaves = data.mode_used === 'walking' ? 'Walking' : (data.summary.departure_time ? `Leave at ${data.summary.departure_time}` : '');
        timeRangeEl.textContent = leaves;
        timeRangeEl.classList.toggle('hidden', !leaves);

        stepsListEl.innerHTML = (note ? `<p class="ns-card ns-card--sand !border-0 px-4 py-3 mb-1 text-[13px] font-semibold text-ink-2">${esc(note)}</p>` : '') + data.steps.map((step) => {
          if (step.travel_mode === 'TRANSIT' && step.transit) {
            const t = step.transit;
            const stops = Number(t.num_stops) || 1;
            return `
              <div class="rm-step">
                <span class="rm-step__icon rm-step__icon--bus"><span class="material-symbols-outlined">directions_bus</span></span>
                <div class="min-w-0 flex-1">
                  <div class="flex items-baseline justify-between gap-3">
                    <p class="text-[15px] font-bold">Bus ${esc(t.line_name || t.vehicle)} at ${esc(t.departure_time)}</p>
                    <span class="text-[13px] font-semibold text-muted flex-shrink-0">${esc(step.duration)}</span>
                  </div>
                  <p class="ns-card-sub mt-1">Get on at ${esc(t.departure_stop)}. Ride ${stops} ${stops === 1 ? 'stop' : 'stops'}.</p>
                  <p class="ns-card-sub">Get off at ${esc(t.arrival_stop)} (${esc(t.arrival_time)}).</p>
                </div>
              </div>
            `;
          }
          return `
            <div class="rm-step">
              <span class="rm-step__icon"><span class="material-symbols-outlined">directions_walk</span></span>
              <div class="min-w-0 flex-1">
                <div class="flex items-baseline justify-between gap-3">
                  <p class="text-[15px] font-semibold">${esc(step.instructions)}</p>
                  <span class="text-[13px] font-semibold text-muted flex-shrink-0">${esc(step.duration)}</span>
                </div>
                <p class="ns-card-sub mt-1">${esc(step.distance)}</p>
              </div>
            </div>
          `;
        }).join('') + `
          <a href="${googleUrl}" target="_blank" rel="noopener" class="ns-link my-2">Open in Google Maps<span class="material-symbols-outlined text-[18px]">open_in_new</span></a>
        `;
      } else {
        durEl.textContent = '';
        stepsListEl.innerHTML = fallbackHtml('Couldn’t find a route', 'Check your internet connection and try again, or open Google Maps.');
      }
    } catch (err) {
      console.warn('Failed to show directions:', err);
      durEl.textContent = '';
      stepsListEl.innerHTML = fallbackHtml('Couldn’t find a route', 'Check your internet connection and try again, or open Google Maps.');
    }
  }

  function switchRouteMode(mode) {
    if (!currentTransitDest) return;
    openTransitModal(currentTransitDest.destName, currentTransitDest.destAddress, currentTransitDest.destLat, currentTransitDest.destLng, mode);
  }

  function closeTransitModal() {
    if (document.getElementById('transit-directions-modal')) {
      closeModal('transit-directions-modal');
    }
  }
  window.openTransitModal = openTransitModal;
  window.closeTransitModal = closeTransitModal;
  window.switchRouteMode = switchRouteMode;
  window.drawRouteOnMapAndClose = drawRouteOnMapAndClose;
</script>
<script src="js/offline-map.js"></script>
</body>
</html>
