<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Map · Northstar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="js/ns-boot.js"></script>
<script src="js/user-data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Leaflet, Dexie (IndexedDB) and leaflet.offline tile caching -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.offline@3.2.1/dist/bundle.min.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/app.css">
<style>
  /* ---- Map page layout (page-specific) ---- */
  .rm-main {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    isolation: isolate; /* keeps Leaflet panes (z 400-1000) inside this box, below sheets and nav */
    background: var(--map-bg);
  }
  #map { position: absolute; inset: 0; z-index: 0; }
  .leaflet-container { background: var(--map-bg); }

  /* Floating top controls */
  .rm-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 1100;
    padding: max(16px, env(safe-area-inset-top)) 0 0;
    pointer-events: none;
  }
  .rm-top > * { pointer-events: auto; }
  .rm-top__row { display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .rm-search {
    flex: 1; min-width: 0;
    height: 44px;
    padding: 0 16px;
    border-radius: 999px;
    background: var(--paper);
    box-shadow: var(--shadow-lift);
    display: flex; align-items: center; gap: 8px;
  }
  .rm-search input {
    flex: 1; min-width: 0; height: 100%;
    border: 0; outline: none; background: transparent;
    font-size: 15px; font-weight: 500; color: var(--ink);
  }
  .rm-search input::placeholder { color: var(--placeholder); }
  .rm-search:focus-within { box-shadow: 0 0 0 1.5px var(--ink), var(--shadow-lift); }
  .rm-pill {
    flex: 1; min-width: 0;
    height: 48px;
    padding: 0 16px 0 14px;
    border-radius: 999px;
    background: var(--paper);
    box-shadow: var(--shadow-lift);
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; color: var(--ink);
    text-align: left;
  }
  .rm-pill > span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 12px; scrollbar-width: none; }
  .rm-chips::-webkit-scrollbar { display: none; }
  .rm-chips .ns-chip { background: var(--paper); box-shadow: var(--shadow-lift); border-color: transparent; }
  .rm-chips .ns-chip.is-active, .rm-chips .ns-chip[aria-pressed='true'] { background: var(--ink); color: var(--on-ink); }
  .rm-chips .ns-chip.is-active { border-color: var(--ink); }
  .rm-count {
    min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 999px; background: var(--ink); color: var(--cream);
    font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* Quiet loading state */
  #map-loading-overlay {
    position: absolute; inset: 0; z-index: 1300;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream);
    transition: opacity 0.4s ease;
  }
  .rm-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--sand-deep); border-top-color: var(--ink);
    animation: rmSpin 0.9s linear infinite;
  }
  @keyframes rmSpin { to { transform: rotate(360deg); } }

  /* Bottom places sheet: draggable, snaps to peek / half / full (see initPlacesSheet) */
  #bottom-drawer-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 1100;
    height: 70%;
    display: flex; flex-direction: column;
    background: var(--paper);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -12px 32px -16px rgba(0, 0, 0, 0.28);
    transform: translateY(var(--sheet-y, 40%));
    transition: transform 0.42s cubic-bezier(0.22, 0.9, 0.24, 1);
    touch-action: none;
    will-change: transform;
  }
  #bottom-drawer-sheet.is-dragging { transition: none; }
  #drawer-header { width: 100%; padding: 6px 16px 10px; text-align: left; cursor: grab; flex-shrink: 0; }
  #bottom-drawer-sheet.is-dragging #drawer-header { cursor: grabbing; }
  #sheet-body {
    flex: 1 1 auto; min-height: 0;
    overflow: hidden;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  #sheet-body::-webkit-scrollbar { display: none; }
  #bottom-drawer-sheet.is-full #sheet-body { overflow-y: auto; touch-action: pan-y; }
  #place-focus-card { padding: 0 16px 14px; }
  #places-list { padding: 4px 16px calc(14px + env(safe-area-inset-bottom)); }
  #places-list:empty { display: none; }
  .rm-list-head { padding: 10px 16px 0; border-top: 1px solid var(--line); }
  .rm-expand-icon { transition: transform 0.3s var(--ease); }
  #bottom-drawer-sheet.is-full .rm-expand-icon { transform: rotate(180deg); }

  /* Map buttons ride on top of the sheet */
  .rm-fabs {
    position: absolute; right: 16px; bottom: calc(100% + 16px);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    transition: opacity 0.2s ease;
  }
  #bottom-drawer-sheet.is-full .rm-fabs,
  #bottom-drawer-sheet.fabs-hidden .rm-fabs { opacity: 0; pointer-events: none; }
  .rm-zoom {
    display: flex; flex-direction: column;
    border-radius: 999px; background: var(--paper); box-shadow: var(--shadow-lift);
    overflow: hidden;
  }
  .rm-zoom button { width: 48px; height: 44px; display: flex; align-items: center; justify-content: center; }
  .rm-zoom button + button { border-top: 1px solid var(--line); }

  /* Pins */
  .ns-pin { background: none; border: 0; }
  .rm-pin {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ink); color: var(--on-ink);
    border: 2px solid var(--paper);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.6);
  }
  .rm-pin .material-symbols-outlined { font-size: 18px; }
  .rm-pin--closed { background: var(--paper); color: var(--muted); border-color: var(--line-strong); box-shadow: 0 2px 6px -3px rgba(0, 0, 0, 0.35); }
  .rm-pin--saved { box-shadow: 0 0 0 3px var(--amber), 0 4px 10px -4px rgba(0, 0, 0, 0.6); }
  .rm-label-pin {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, calc(-100% - 6px));
    display: flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 14px 0 10px;
    border-radius: 999px;
    background: var(--amber); color: #111111;
    font-size: 13px; font-weight: 700; white-space: nowrap;
    max-width: 220px;
    box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.35);
  }
  .rm-label-pin span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .rm-label-pin .material-symbols-outlined { font-size: 18px; }
  .rm-label-dot {
    position: absolute; left: -6px; top: -6px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--paper);
  }
  .rm-me {
    width: 22px; height: 22px; border-radius: 50%;
    background: color-mix(in srgb, var(--ink) 16%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .rm-me span { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid var(--paper); }
  .rm-stop {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--amber); color: #111111; border: 2px solid #111111;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }

  /* Directions steps */
  .rm-step { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .rm-step:last-child { border-bottom: 0; }
  .rm-step__icon { width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--sand); color: var(--ink); }
  .rm-step__icon--bus { background: var(--ink); color: var(--cream); }
  .rm-step__icon .material-symbols-outlined { font-size: 20px; }
  /* Place card details (who it's for, hours, notes, source) */
  .place-info { display: flex; flex-direction: column; gap: 6px; }
  .place-line { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--ink-2); }
  .place-line .material-symbols-outlined { font-size: 18px; color: var(--muted); margin-top: 1px; flex-shrink: 0; }
  .place-line b { color: var(--ink); font-weight: 700; }
  .place-hours { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin-top: 1px; }
  .place-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: var(--amber-ink); background: var(--amber-wash); border-radius: 10px; padding: 8px 10px; }
  .place-check .material-symbols-outlined { font-size: 18px; flex-shrink: 0; }
  .place-flag { background: var(--flag-wash); color: var(--flag-ink); }
  .place-source { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .place-source a { color: var(--muted); text-decoration: underline; }
  /* Route lines and the search radius follow the theme (CSS beats Leaflet's stroke attribute) */
  path.ns-ink-line { stroke: var(--ink); fill: var(--ink); }
</style>
</head>
<body>

<div class="app-frame">

    <main class="rm-main" aria-label="Map of places near you">

        <div id="map" class="ns-map-soft"></div>

        <!-- Quiet loading state -->
        <div id="map-loading-overlay" role="status" aria-live="polite">
            <div class="flex flex-col items-center gap-3">
                <div class="rm-spinner" aria-hidden="true"></div>
                <p class="text-[14px] font-semibold text-ink-2">Loading the map</p>
            </div>
        </div>

        <!-- Top: location pill + category chips -->
        <div class="rm-top">
            <div class="rm-top__row">
                <button type="button" class="ns-icon-btn ns-icon-btn--float" onclick="rmBack()" aria-label="Back">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <form class="rm-search" role="search" onsubmit="event.preventDefault(); setMapSearch(this.q.value, true); this.q.blur();">
                    <span class="material-symbols-outlined text-[21px] text-ink-2" aria-hidden="true">search</span>
                    <input id="map-search-input" name="q" type="search" placeholder="Beds, meals, Wi-Fi near me" aria-label="Search places" autocomplete="off" enterkeyhint="search" oninput="setMapSearch(this.value)">
                    <button type="button" id="map-search-clear" class="hidden -mr-2 w-9 h-9 grid place-items-center rounded-full text-ink-2" onclick="clearMapSearch()" aria-label="Clear search">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                    <span id="location-name-label" class="sr-only">Seattle area</span>
                </form>
            </div>

            <div class="rm-chips" role="toolbar" aria-label="Show places by type">
                <button type="button" class="ns-chip" onclick="openMapFilters()" aria-label="Filters">
                    <span class="material-symbols-outlined">tune</span>
                    <span>Filters</span>
                    <span id="filters-count" class="rm-count hidden">0</span>
                </button>
                <button type="button" data-cat="all" data-icon="" onclick="toggleCategoryFilter('all')" class="cat-pill-btn ns-chip is-active" aria-pressed="true">
                    <span class="material-symbols-outlined">check</span><span>All</span>
                </button>
                <button type="button" data-cat="shelter" data-icon="bed" onclick="toggleCategoryFilter('shelter')" class="cat-pill-btn ns-chip" aria-pressed="false">
                    <span class="material-symbols-outlined">bed</span><span>Beds</span>
                </button>
                <button type="button" data-cat="food" data-icon="restaurant" onclick="toggleCategoryFilter('food')" class="cat-pill-btn ns-chip" aria-pressed="false">
                    <span class="material-symbols-outlined">restaurant</span><span>Meals</span>
                </button>
                <button type="button" data-cat="restroom" data-icon="shower" onclick="toggleCategoryFilter('restroom')" class="cat-pill-btn ns-chip" aria-pressed="false">
                    <span class="material-symbols-outlined">shower</span><span>Showers</span>
                </button>
                <button type="button" data-cat="wifi" data-icon="wifi" onclick="toggleCategoryFilter('wifi')" class="cat-pill-btn ns-chip" aria-pressed="false">
                    <span class="material-symbols-outlined">wifi</span><span>Wi-Fi</span>
                </button>
                <button type="button" data-cat="charging" data-icon="power" onclick="toggleCategoryFilter('charging')" class="cat-pill-btn ns-chip" aria-pressed="false">
                    <span class="material-symbols-outlined">power</span><span>Charging</span>
                </button>
                <button type="button" data-cat="daycenter" data-icon="home" onclick="toggleCategoryFilter('daycenter')" class="cat-pill-btn ns-chip" aria-pressed="false">
                    <span class="material-symbols-outlined">home</span><span>Day centers</span>
                </button>
            </div>
        </div>

        <!-- Bottom sheet: focused place, expands into the full list -->
        <section id="bottom-drawer-sheet" aria-label="Places">
            <div class="rm-fabs">
                <button type="button" onclick="_centerOnMeRequested = true; locateAndCenterUser()" class="ns-icon-btn" aria-label="Show my location">
                    <span class="material-symbols-outlined">my_location</span>
                </button>
                <div class="rm-zoom">
                    <button type="button" onclick="if(map) map.zoomIn()" aria-label="Zoom in"><span class="material-symbols-outlined">add</span></button>
                    <button type="button" onclick="if(map) map.zoomOut()" aria-label="Zoom out"><span class="material-symbols-outlined">remove</span></button>
                </div>
            </div>

            <button id="drawer-header" type="button" onclick="toggleBottomDrawer()" aria-expanded="false" aria-controls="sheet-body" aria-label="Places list. Drag or tap to show more or less">
                <span class="ns-sheet__handle block" style="margin-bottom:12px"></span>
                <span class="flex items-center gap-2">
                    <span id="drawer-title" class="text-[15px] font-bold flex-1">Places nearby</span>
                    <span id="drawer-count-badge" class="ns-badge ns-badge--sand">0</span>
                    <span class="material-symbols-outlined rm-expand-icon text-[22px]">expand_less</span>
                </span>
            </button>

            <div id="sheet-body">
                <div id="place-focus-card" class="hidden"></div>
                <p class="rm-list-head ns-card-sub hidden">All places</p>
                <div id="places-list" class="drawer-content-list ns-list">
                    <!-- Populated by renderDrawerPlaces() -->
                </div>
            </div>
        </section>

    </main>

    <nav class="bottom-nav ns-nav" aria-label="Main"></nav>

    <!-- SHEET: filters, mode, distance, offline, add a place -->
    <div id="map-filters-modal" class="ns-sheet-wrap hidden">
        <div class="ns-sheet-backdrop" onclick="closeModal('map-filters-modal')"></div>
        <div class="modal-drawer ns-sheet translate-y-full">
            <div class="ns-sheet__handle"></div>
            <div class="flex items-center justify-between gap-3">
                <h2 class="ns-sheet__title">Filters</h2>
                <button type="button" class="ns-icon-btn ns-icon-btn--sm" onclick="closeModal('map-filters-modal')" aria-label="Close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <p class="ns-label mt-6">Show</p>
            <div class="ns-segment" role="group" aria-label="Which places">
                <button type="button" id="mode-btn-nearby" onclick="switchMapMode('nearby')" class="is-active">Nearby</button>
                <button type="button" id="mode-btn-saved" onclick="switchMapMode('saved')">Saved</button>
                <button type="button" id="mode-btn-offline" onclick="window.toggleOfflineDirectoryModal && window.toggleOfflineDirectoryModal()">Offline</button>
            </div>

            <div id="offline-panel" class="hidden" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line)">
                <p class="ns-card-title">Use the map without internet</p>
                <p id="offline-panel-status" class="ns-card-sub mt-1">Download a list of shelters, food and health care near Seattle, with a map. It opens on your phone with no signal.</p>
                <button id="download-offline-btn" type="button" class="ns-btn ns-btn--secondary ns-btn--sm w-full mt-4">Download</button>
            </div>

            <p class="ns-label mt-6">Distance</p>
            <div id="radius-controls" class="ns-segment" role="group" aria-label="Distance from you">
                <button type="button" id="radius-btn-5" onclick="setSearchRadius(5)" class="radius-pill-btn is-active">5 mi</button>
                <button type="button" id="radius-btn-10" onclick="setSearchRadius(10)" class="radius-pill-btn">10 mi</button>
                <button type="button" id="radius-btn-25" onclick="setSearchRadius(25)" class="radius-pill-btn">25 mi</button>
            </div>

            <p class="ns-label mt-6">Run by</p>
            <div class="ns-segment" role="group" aria-label="Who runs the place">
                <button type="button" id="scope-btn-everyone" onclick="setScopeFilter('everyone')" class="is-active">Anyone</button>
                <button type="button" id="scope-btn-verified" onclick="setScopeFilter('verified')">Verified only</button>
            </div>

            <div class="ns-list mt-4">
                <label class="ns-row cursor-pointer" for="open-now-btn">
                    <span class="ns-row__body">
                        <span class="ns-row__title block">Open now</span>
                        <span id="open-now-text" class="ns-row__sub block">Hide places that are closed right now</span>
                    </span>
                    <input type="checkbox" id="open-now-btn" class="ns-switch" onchange="toggleOpenNowFilter()">
                </label>
                <button type="button" class="ns-row" onclick="closeModal('map-filters-modal'); _centerOnMeRequested = true; locateAndCenterUser();">
                    <span class="ns-tile ns-tile--plain ns-tile--sm"><span class="material-symbols-outlined">near_me</span></span>
                    <span class="ns-row__body">
                        <span class="ns-row__title block">Use my location</span>
                        <span class="ns-row__sub block">Center the map on where you are</span>
                    </span>
                    <span class="material-symbols-outlined ns-chevron">chevron_right</span>
                </button>
                <button type="button" class="ns-row" onclick="closeModal('map-filters-modal'); setTimeout(openAddResourceModal, 320);">
                    <span class="ns-tile ns-tile--plain ns-tile--sm"><span class="material-symbols-outlined">add_location_alt</span></span>
                    <span class="ns-row__body">
                        <span class="ns-row__title block">Add a place</span>
                        <span class="ns-row__sub block">Mark a meal, shelter or other spot</span>
                    </span>
                    <span class="material-symbols-outlined ns-chevron">chevron_right</span>
                </button>
            </div>

            <button id="filters-apply-btn" type="button" class="ns-btn ns-btn--primary mt-6" onclick="closeModal('map-filters-modal')">Show places</button>
        </div>
    </div>

    <!-- SHEET: bus and walking directions -->
    <div id="transit-directions-modal" class="ns-sheet-wrap hidden">
        <div class="ns-sheet-backdrop" onclick="closeTransitModal()"></div>
        <div class="modal-drawer ns-sheet translate-y-full flex flex-col" style="padding-bottom:0">
            <div class="ns-sheet__handle flex-shrink-0"></div>
            <div class="flex items-start gap-3 flex-shrink-0">
                <div class="min-w-0 flex-1">
                    <h2 id="transit-dest-name" class="text-[20px] font-bold leading-tight">Directions</h2>
                    <p id="transit-dest-address" class="ns-card-sub mt-1 truncate"></p>
                </div>
                <button type="button" onclick="closeTransitModal()" class="ns-icon-btn ns-icon-btn--sm" aria-label="Close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="ns-segment mt-4 flex-shrink-0" role="group" aria-label="How you travel">
                <button type="button" id="mode-btn-hybrid" onclick="switchRouteMode('transit')" class="is-active">Bus and walk</button>
                <button type="button" id="mode-btn-walking" onclick="switchRouteMode('walking')">Walk only</button>
            </div>

            <div id="transit-summary-bar" class="flex items-center justify-between gap-3 mt-4 flex-shrink-0">
                <div class="flex items-baseline gap-2">
                    <span id="transit-total-duration" class="text-[22px] font-bold tracking-tight">–</span>
                    <span id="transit-total-distance" class="text-[14px] font-semibold text-muted"></span>
                </div>
                <span id="transit-time-range" class="ns-badge ns-badge--sand"></span>
            </div>

            <div id="transit-steps-list" class="flex-1 min-h-[140px] mt-2 overflow-y-auto no-scrollbar"></div>

            <div class="flex-shrink-0 pt-3 pb-[max(20px,env(safe-area-inset-bottom))] bg-paper">
                <button id="view-on-map-route-btn" type="button" onclick="drawRouteOnMapAndClose()" class="ns-btn ns-btn--primary">
                    <span class="material-symbols-outlined">map</span>
                    <span>Show route on map</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SHEET: add a place -->
    <div id="add-resource-modal" class="ns-sheet-wrap hidden">
        <div class="ns-sheet-backdrop" onclick="closeAddResourceModal()"></div>
        <div class="modal-drawer ns-sheet translate-y-full">
            <div class="ns-sheet__handle"></div>
            <div class="flex items-center justify-between gap-3">
                <h2 class="ns-sheet__title">Add a place</h2>
                <button type="button" onclick="closeAddResourceModal()" class="ns-icon-btn ns-icon-btn--sm" aria-label="Close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <p class="ns-card-sub mt-1">It shows on your map on this phone.</p>

            <form id="new-resource-form" onsubmit="handleCreateResource(event)" class="mt-5 flex flex-col gap-4">
                <div>
                    <label class="ns-label" for="res-title">Name</label>
                    <input type="text" id="res-title" required placeholder="Community meal at St. Mark's" class="ns-input">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="ns-label" for="res-category">Type</label>
                        <select id="res-category" class="ns-select">
                            <option value="food">Meals</option>
                            <option value="shelter">Shelter</option>
                            <option value="daycenter">Day center</option>
                            <option value="wifi">Wi-Fi</option>
                            <option value="restroom">Showers</option>
                            <option value="charging">Charging</option>
                        </select>
                    </div>
                    <div>
                        <label class="ns-label" for="res-hours">Hours</label>
                        <input type="text" id="res-hours" placeholder="08:00 - 20:00" class="ns-input">
                    </div>
                </div>
                <div>
                    <label class="ns-label" for="res-address">Address</label>
                    <input type="text" id="res-address" required placeholder="515 3rd Ave, Seattle" class="ns-input">
                </div>
                <div>
                    <label class="ns-label" for="res-details">Details</label>
                    <textarea id="res-details" rows="2" placeholder="What to know before you go" class="ns-textarea"></textarea>
                </div>
                <button type="submit" class="ns-btn ns-btn--primary mt-2">Add to map</button>
            </form>
        </div>
    </div>

</div><!-- /.app-frame -->

<script src="js/resources-data.js"></script>
<script src="js/places.js"></script>
<script src="js/northstar.js"></script>
    <script src="js/jobs.js"></script>
<script>
  let map;
  let offlineLayer;
  let mapMarkers = [];
  let userLocationMarker = null;
  let userRadiusCircle = null;
  let userLocationCoords = null;
  
  // REAL FILTERING STATE CONTROLLERS
  let activeSelectedCategories = ['all']; // Multi-select array
  let isOpenNowFilterActive = false;      // Off by default: closed places stay visible (dimmed) with their next opening time
  let activeScopeFilter = 'everyone';   // 'everyone' or 'verified'
  let activeRadiusMiles = 5;            // Radius modifier (5, 10, 25 miles)
  // Until the person picks a distance, widen 5 → 10 → 25 mi when too few places are nearby
  const MIN_NEARBY_PLACES = 5;
  let radiusChosenByUser = false;
  let effectiveRadiusMiles = activeRadiusMiles;
  let activeMapMode = 'nearby';         // 'nearby' or 'saved'
  let isDrawerExpanded = false;

  // USER BOOKMARKED / SAVED PLACES STATE & PERSISTENCE
  const USER_SAVED_STORAGE_KEY = 'northstar_user_saved_places';

  function getSavedPlaceIds() {
    try {
      const stored = localStorage.getItem(USER_SAVED_STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) return [...new Set(parsed.map(id => (typeof resolvePlaceId === 'function' ? resolvePlaceId(id) : id)))];
      }
    } catch (e) {
      console.warn('Error reading saved places:', e);
    }
    return [];
  }

  function isPlaceSaved(placeId) {
    const list = getSavedPlaceIds();
    return list.includes(placeId);
  }

  async function toggleSavePlace(placeId, event) {
    if (event && event.stopPropagation) {
      event.stopPropagation();
    }

    const currentList = getSavedPlaceIds();
    const idx = currentList.indexOf(placeId);
    let isNowSaved = false;

    if (idx >= 0) {
      currentList.splice(idx, 1);
      isNowSaved = false;
    } else {
      currentList.push(placeId);
      isNowSaved = true;
    }

    localStorage.setItem(USER_SAVED_STORAGE_KEY, JSON.stringify(currentList));
    // Mirror to the key the progress tracker reads, and mark the milestone
    try { localStorage.setItem('northstar_saved_resources', JSON.stringify(currentList)); } catch (e) {}
    if (isNowSaved && typeof updateMilestone === 'function') {
      try { updateMilestone('savedLocation', true); } catch (e) { console.warn('Milestone update failed:', e); }
    }

    // Saved places reach the account through js/user-data.js (northstar_user_saved_places)
    applyCombinedFilters();
  }
  window.toggleSavePlace = toggleSavePlace;

  // Verified places: js/resources-data.js, built from src/data/northstar_seattle_resources.csv
  // by scripts/build-resources.py. Places in the same building get a small pin offset.
  function toMapPlace(p) {
    const place = { ...p };
    if (typeof p.lat === 'number' && p.pinSlots > 1) {
      const angle = (2 * Math.PI * p.pinSlot) / p.pinSlots;
      place.pinLat = p.lat + 0.00016 * Math.sin(angle);
      place.pinLng = p.lng + 0.00024 * Math.cos(angle);
    }
    return place;
  }
  const defaultResources = (window.NS_RESOURCES || []).map(toMapPlace);
  // Older place ids (saved places, Companion links) -> current ones
  const PLACE_ALIASES = {};
  defaultResources.forEach(p => (p.aliases || []).forEach(old => { PLACE_ALIASES[old] = p.id; }));
  function resolvePlaceId(id) { return PLACE_ALIASES[id] || id; }
  window.resolvePlaceId = resolvePlaceId;
  function hasPin(p) { return typeof p.lat === 'number' && typeof p.lng === 'number'; }
  function placeInCategories(p, cats) {
    const list = Array.isArray(p.categories) && p.categories.length ? p.categories : [p.category];
    return list.some(c => cats.includes(c));
  }

  // Places people add themselves (not verified) stay on this phone
  const CUSTOM_PLACES_KEY = 'northstar_custom_places';
  const OLD_RESOURCE_CACHE_KEY = 'cached_resources_v2_live_hours';
  function getCustomPlaces() {
    try {
      // One-time move: older builds kept added places inside a cached copy of the whole list
      const old = localStorage.getItem(OLD_RESOURCE_CACHE_KEY);
      if (old) {
        const added = (JSON.parse(old) || []).filter(r => r && String(r.id).startsWith('res-custom-'));
        if (added.length && !localStorage.getItem(CUSTOM_PLACES_KEY)) localStorage.setItem(CUSTOM_PLACES_KEY, JSON.stringify(added));
        localStorage.removeItem(OLD_RESOURCE_CACHE_KEY);
        localStorage.removeItem('cached_resources');
      }
      const list = JSON.parse(localStorage.getItem(CUSTOM_PLACES_KEY) || '[]');
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }
  function saveCustomPlaces(list) {
    try { localStorage.setItem(CUSTOM_PLACES_KEY, JSON.stringify(list)); } catch (e) {}
  }

  // Plain-words status for a place right now (js/places.js)
  const placeStatus = (p, now) => window.nsPlaceStatus(p, now);
  window.placeStatus = placeStatus;

  function getResourcesData() {
    return [...getCustomPlaces(), ...defaultResources].map(p => ({ ...p, status: placeStatus(p).text }));
  }

  async function loadResourcesFromDatabase() {
    if (typeof updateVisiblePlaces === 'function') updateVisiblePlaces();
  }

  function applyUrlFilters() {
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('category');
    const q = params.get('q');
    const filter = params.get('filter');
    let changed = false;
    if (cat && document.querySelector(`.cat-pill-btn[data-cat="${cat}"]`)) {
      toggleCategoryFilter(cat);
      params.delete('category');
      changed = true;
    }
    if (q) {
      const input = document.getElementById('map-search-input');
      if (input) input.value = q;
      setMapSearch(q, true);
      params.delete('q');
      changed = true;
    }
    if (filter) {
      // From Give help → "I'll drop it off myself": head to the food bank they picked
      if (filter === 'food_dropoff') {
        let planned = '';
        try { planned = String(localStorage.getItem('northstar_planned_dropoff') || '').trim().toLowerCase(); } catch (e) {}
        const norm = s => String(s || '').trim().toLowerCase();
        const all = planned ? getResourcesData() : [];
        const match = planned && (
          all.find(r => norm(r.name) === planned || (Array.isArray(r.aliases) && r.aliases.some(a => norm(a) === planned))) ||
          all.find(r => { const n = norm(r.name); return n.length > 6 && (planned.includes(n) || n.includes(planned)); })
        );
        if (match) {
          params.set('resource', String(match.id));
        } else if (document.querySelector('.cat-pill-btn[data-cat="food"]')) {
          toggleCategoryFilter('food');
        }
      }
      params.delete('filter');
      changed = true;
    }
    if (changed) {
      const qs = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (qs ? `?${qs}` : ''));
      // A place picked above is focused by the deep-link path once the markers are drawn
      if (params.has('resource') && typeof applyCombinedFilters === 'function') applyCombinedFilters();
    }
  }

  function clearFocusedPlace(event) {
    if (event && event.stopPropagation) event.stopPropagation();
    focusedPlaceId = null;
    currentFocusId = null;
    window.northstarSelectedMapResourceId = null;
    if (typeof clearActiveRouteOnMap === 'function') clearActiveRouteOnMap();
    applyCombinedFilters();
    if (typeof snapPlacesSheet === 'function') snapPlacesSheet('peek');
  }
  window.clearFocusedPlace = clearFocusedPlace;

  function resetMapToHome(opts = {}) {
    focusedPlaceId = null;
    currentFocusId = null;
    window.northstarSelectedMapResourceId = null;
    if (typeof clearActiveRouteOnMap === 'function') clearActiveRouteOnMap();
    if (typeof closeTransitModal === 'function') closeTransitModal();
    if (typeof closeModal === 'function') {
      closeModal('map-filters-modal');
      closeModal('add-resource-modal');
    }

    mapSearchQuery = '';
    const searchInput = document.getElementById('map-search-input');
    if (searchInput) searchInput.value = '';
    const clearBtn = document.getElementById('map-search-clear');
    if (clearBtn) clearBtn.classList.add('hidden');

    activeMapMode = 'nearby';
    isOfflineView = !navigator.onLine;
    activeScopeFilter = 'everyone';
    isOpenNowFilterActive = false;
    const openNowBtn = document.getElementById('open-now-btn');
    if (openNowBtn) openNowBtn.checked = false;
    setPressed(document.getElementById('scope-btn-everyone'), true);
    setPressed(document.getElementById('scope-btn-verified'), false);
    syncModeButtons();

    activeRadiusMiles = 5;
    effectiveRadiusMiles = 5;
    radiusChosenByUser = false;

    activeSelectedCategories = ['all'];
    document.querySelectorAll('.cat-pill-btn').forEach(btn => {
      const on = btn.dataset.cat === 'all';
      setPressed(btn, on);
      const iconEl = btn.querySelector('.material-symbols-outlined');
      const baseIcon = btn.dataset.icon || '';
      if (iconEl) {
        iconEl.textContent = on ? 'check' : baseIcon;
        iconEl.classList.toggle('hidden', !on && !baseIcon);
      }
    });

    applyCombinedFilters();
    if (typeof snapPlacesSheet === 'function') {
      snapPlacesSheet('peek', { animate: !opts.silent });
    }
    if (!opts.silent && map && userRadiusCircle && typeof map.fitBounds === 'function') {
      map.fitBounds(userRadiusCircle.getBounds(), Object.assign({ animate: true }, mapFitPadding()));
    }
  }
  window.resetMapToHome = resetMapToHome;

  document.addEventListener('DOMContentLoaded', () => {
    initPlacesSheet();
    initLeafletCleanMap();
    setTimeout(applyUrlFilters, 0);
    loadResourcesFromDatabase();

    // Highlight Offline mode pill if loaded with ?offline=true or when offline
    if (!navigator.onLine || window.location.search.includes('offline=true')) {
      isOfflineView = true;
      syncModeButtons();
      const locLabel = document.getElementById('location-name-label');
      if (locLabel) {
        locLabel.textContent = 'Offline map';
      }
      const offlineStatus = document.getElementById('offline-panel-status');
      if (offlineStatus) {
        offlineStatus.textContent = "You're offline. The map shows places saved on this phone. You can also download a list with a map to open later.";
      }
    }
    syncFilterSummary();

    // Tapping the Map tab in the bottom nav while already on the map returns to the home map screen
    document.addEventListener('click', (e) => {
      const navLink = e.target.closest('.bottom-nav a[data-nav-tab="map"], .bottom-nav a[href="resource-map.html"]');
      if (navLink) {
        e.preventDefault();
        resetMapToHome();
      }
    });
  });

  // Reset back to the clean home map screen whenever leaving and returning to the map
  window.addEventListener('pagehide', () => {
    resetMapToHome({ silent: true });
  });
  window.addEventListener('pageshow', (e) => {
    const sp = new URLSearchParams(window.location.search);
    const hasDeepLink = sp.has('resource') || sp.has('category') || sp.has('q') || sp.has('filter');
    if (e.persisted && !hasDeepLink) {
      resetMapToHome({ silent: true });
    }
  });

  // ---- Page UI helpers (filters sheet, mode buttons, focused place) ----
  let isOfflineView = false;          // Offline panel shown in the filters sheet
  let focusedPlaceId = null;          // Place the person tapped (or deep-linked)
  let currentFocusId = null;          // Place shown in the bottom sheet right now
  let lastFilteredCount = 0;

  const CATEGORY_META = {
    shelter: { icon: 'bed', label: 'Shelter' },
    food: { icon: 'restaurant', label: 'Meals' },
    restroom: { icon: 'shower', label: 'Showers' },
    wifi: { icon: 'wifi', label: 'Wi-Fi' },
    charging: { icon: 'power', label: 'Charging' },
    daycenter: { icon: 'home', label: 'Day center' },
    work: { icon: 'work', label: 'Gig work' },
    health: { icon: 'medical_services', label: 'Health care' }
  };
  function categoryMeta(cat) {
    return CATEGORY_META[cat] || { icon: 'location_on', label: 'Place' };
  }
  const esc = (v) => (typeof nsEscape === 'function' ? nsEscape(v) : String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
  // Safe for a single-quoted JS string inside a double-quoted HTML attribute
  const jsArg = (v) => esc(String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));

  function setPressed(el, on) {
    if (!el) return;
    el.classList.toggle('is-active', !!on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function syncModeButtons() {
    setPressed(document.getElementById('mode-btn-nearby'), !isOfflineView && activeMapMode === 'nearby');
    setPressed(document.getElementById('mode-btn-saved'), !isOfflineView && activeMapMode === 'saved');
    setPressed(document.getElementById('mode-btn-offline'), isOfflineView);
    const panel = document.getElementById('offline-panel');
    if (panel) panel.classList.toggle('hidden', !isOfflineView);
  }

  window.toggleOfflineDirectoryModal = function () {
    isOfflineView = !isOfflineView;
    syncModeButtons();
  };

  function openMapFilters() {
    syncFilterSummary();
    openModal('map-filters-modal');
  }
  window.openMapFilters = openMapFilters;

  function syncFilterSummary() {
    let n = 0;
    if (activeMapMode === 'saved') n++;
    if (activeScopeFilter === 'verified') n++;
    if (isOpenNowFilterActive) n++;
    if (radiusChosenByUser && activeRadiusMiles !== 5) n++;
    const countEl = document.getElementById('filters-count');
    if (countEl) {
      countEl.textContent = n;
      countEl.classList.toggle('hidden', n === 0);
    }
    [5, 10, 25].forEach(m => setPressed(document.getElementById(`radius-btn-${m}`), m === effectiveRadiusMiles));
    const applyBtn = document.getElementById('filters-apply-btn');
    if (applyBtn) {
      applyBtn.textContent = lastFilteredCount === 0
        ? 'Close'
        : `Show ${lastFilteredCount} ${lastFilteredCount === 1 ? 'place' : 'places'}`;
    }
  }

  function formatMiles(miles) {
    if (!Number.isFinite(miles)) return '';
    return miles < 0.1 ? 'Under 0.1 mi' : `${miles.toFixed(1)} mi`;
  }

  function renderFocusCard(res) {
    const card = document.getElementById('place-focus-card');
    const listHead = document.querySelector('.rm-list-head');
    if (!card) return;

    if (!res) {
      if (lastFilteredCount > 0) {
        card.innerHTML = '';
        card.classList.add('hidden');
        if (listHead) listHead.classList.add('hidden');
        return;
      }
      card.classList.remove('hidden');
      if (listHead) listHead.classList.add('hidden');
      const savedMode = activeMapMode === 'saved';
      if (mapSearchQuery) {
        card.innerHTML = `
          <div class="ns-empty">
            <p class="ns-empty__title">No places match “${esc(mapSearchQuery)}”</p>
            <p class="ns-empty__sub">Try a simpler word like bed, meal, shower or Wi-Fi. You can also ask Companion or call 211.</p>
            <div class="flex justify-center gap-2 mt-4">
              <button type="button" class="ns-btn ns-btn--primary ns-btn--sm" onclick="clearMapSearch()">Clear search</button>
              <a href="companion.html?q=${encodeURIComponent('Where can I find ' + mapSearchQuery + '?')}" class="ns-btn ns-btn--secondary ns-btn--sm">Ask Companion</a>
            </div>
          </div>`;
        return;
      }
      card.innerHTML = `
        <div class="ns-empty">
          <p class="ns-empty__title">${savedMode ? 'No saved places here' : 'Nothing matches here'}</p>
          <p class="ns-empty__sub">${savedMode ? 'Tap the bookmark on a place to save it.' : 'Try a longer distance, or turn off “Open now”.'}</p>
          <button type="button" class="ns-btn ns-btn--ghost ns-btn--sm mt-4" onclick="openMapFilters()">Change filters</button>
        </div>`;
      return;
    }

    card.classList.remove('hidden');
    if (listHead) listHead.classList.remove('hidden');

    const st = placeStatus(res);
    const saved = isPlaceSaved(res.id);
    const tel = (res.tel || (res.phone || '').replace(/[^0-9+]/g, '')).trim();
    const pinned = hasPin(res);
    const cats = (Array.isArray(res.categories) && res.categories.length ? res.categories : [res.category]).slice(0, 3);
    const statusBadge = st.open === true
      ? `<span class="ns-badge ns-badge--sand ns-badge--dot">${esc(st.text.startsWith('Open 24') ? 'Open 24 hours' : 'Open now')}</span>`
      : st.open === null
        ? '<span class="ns-badge ns-badge--sand"><span class="material-symbols-outlined">call</span>Call first</span>'
        : `<span class="ns-badge ns-badge--sand">${esc(res.closedNote ? 'Closed for now' : 'Closed now')}</span>`;
    const badges = [
      res.verifiedOnly ? '<span class="ns-badge ns-badge--leaf"><span class="material-symbols-outlined">verified</span>Verified</span>' : '',
      statusBadge,
      res.referralOnly ? '<span class="ns-badge place-flag"><span class="material-symbols-outlined">info</span>Referral only</span>' : '',
      res.idRequired ? '<span class="ns-badge place-flag"><span class="material-symbols-outlined">person</span>ID needed</span>' : '',
      ...cats.map(c => { const m = categoryMeta(c); return `<span class="ns-badge ns-badge--sand"><span class="material-symbols-outlined">${m.icon}</span>${esc(m.label)}</span>`; })
    ].join('');

    const dist = formatMiles(res.distanceMiles);
    const where = pinned ? res.address : 'Address kept private · call for help';
    const src = (res.sources || [])[0];
    const srcDate = src && src.asOf ? formatAsOf(src.asOf) : '';
    const info = [
      res.population ? `<p class="place-line"><span class="material-symbols-outlined">group</span><span><b>For:</b> ${esc(res.population)}</span></p>` : '',
      `<p class="place-line"><span class="material-symbols-outlined">schedule</span><span class="${st.open === true ? 'text-leaf font-semibold' : ''}">${esc(st.text)}${res.hours && !/^(see spl|building hours|call)/i.test(res.hours) && !/^(24 hours daily|24\/7)$/i.test(res.hours.trim()) && !res.closedNote ? `<span class="place-hours">${esc(res.hours)}</span>` : ''}</span></p>`,
      res.description ? `<p class="place-line"><span class="material-symbols-outlined">info</span><span>${esc(res.description)}</span></p>` : '',
      res.checkNote && !res.closedNote ? `<p class="place-check"><span class="material-symbols-outlined">warning</span><span>${esc(res.checkNote)}. Call to confirm before you go.</span></p>` : ''
    ].join('');

    card.innerHTML = `
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h3 class="text-[18px] font-extrabold leading-snug tracking-tight">${esc(res.name)}</h3>
          <p class="ns-card-sub mt-0.5 line-clamp-2">${[dist ? esc(dist) : '', esc(where)].filter(Boolean).join(' · ')}</p>
        </div>
        <div class="flex items-center gap-1 flex-shrink-0 -mr-2 -mt-1">
          <button type="button" class="ns-icon-btn ns-icon-btn--bare" onclick="toggleSavePlace('${jsArg(res.id)}', event)" aria-pressed="${saved}" aria-label="${saved ? 'Remove from saved' : 'Save this place'}">
            <span class="material-symbols-outlined ${saved ? 'ms-fill' : ''}">bookmark</span>
          </button>
          <button type="button" class="ns-icon-btn ns-icon-btn--bare" onclick="clearFocusedPlace(event)" aria-label="Close place details">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 mt-3">${badges}</div>
      <div class="place-info mt-3">${info}</div>
      ${src ? `<p class="place-source">Source: ${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title)}</a>` : esc(src.title)}${srcDate ? ` · ${esc(srcDate)}` : ''}</p>` : ''}
      <div class="flex items-center gap-3 mt-4">
        ${tel ? `<a href="tel:${esc(tel)}" class="ns-btn ${pinned && !res.referralOnly ? 'ns-btn--ghost !w-auto px-6 flex-shrink-0' : 'ns-btn--primary flex-1'}" aria-label="Call ${esc(res.name)}"><span class="material-symbols-outlined">call</span><span>Call${pinned && !res.referralOnly ? '' : ' ' + esc(res.phone.split(/[;(]/)[0].trim())}</span></a>` : ''}
        ${pinned && !res.referralOnly ? `<button type="button" class="ns-btn ns-btn--primary flex-1" onclick="openTransitModal('${jsArg(res.name)}', '${jsArg(res.address)}', ${Number(res.lat)}, ${Number(res.lng)})">
          <span>Directions</span><span class="material-symbols-outlined">keyboard_double_arrow_right</span>
        </button>` : ''}
      </div>`;
  }

  function formatAsOf(v) {
    const m = /^(\d{4})-(\d{2})$/.exec(String(v).split('|')[0].trim());
    if (!m) return String(v);
    return `${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(m[2]) - 1]} ${m[1]}`;
  }

  function initLeafletCleanMap() {
    const startCoords = [47.6062, -122.3321]; // Downtown Seattle

    map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(startCoords, 14);

    offlineLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    map.on('click', () => {
      if (focusedPlaceId || (typeof placesSheet !== 'undefined' && placesSheet.state !== 'peek')) {
        clearFocusedPlace();
      }
    });

    // Do not rebuild every marker while NorthStar is programmatically
    // focusing a resource. Rebuilding markers destroys an open popup.
    map.on('moveend zoomend', () => {
      if (window.northstarProgrammaticMapFocus) {
        return;
      }

      updateVisiblePlaces();
    });

    locateAndCenterUser();

    setTimeout(() => {
      const overlay = document.getElementById('map-loading-overlay');
      if (overlay) {
        overlay.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 700);
      }
    }, 1200);
  }

  function getActiveReferenceCoords() {
    // 1. If userRadiusCircle exists, its center is the exact center of the active search perimeter
    if (userRadiusCircle && typeof userRadiusCircle.getLatLng === 'function') {
      const circleCenter = userRadiusCircle.getLatLng();
      if (circleCenter && circleCenter.lat && circleCenter.lng) {
        return { lat: circleCenter.lat, lng: circleCenter.lng };
      }
    }
    // 2. If userLocationCoords is set, valid, and within 60 miles of the Seattle mock cluster
    if (userLocationCoords && typeof userLocationCoords.lat === 'number' && typeof userLocationCoords.lng === 'number') {
      if (userLocationCoords.lat !== 0 && userLocationCoords.lng !== 0) {
        const distFromCluster = calculateDistanceMiles(userLocationCoords.lat, userLocationCoords.lng, 47.6062, -122.3321);
        if (distFromCluster < 60) {
          return userLocationCoords;
        }
      }
    }
    // 3. Otherwise use map center if valid
    if (map && typeof map.getCenter === 'function') {
      const c = map.getCenter();
      if (c && c.lat && c.lng && (c.lat !== 0 || c.lng !== 0)) {
        return { lat: c.lat, lng: c.lng };
      }
    }
    // 4. Fallback to Downtown Seattle anchor
    return { lat: 47.6062, lng: -122.3321 };
  }

  function renderBlueDot(latitude, longitude) {
    if (!map) return;
    userLocationCoords = { lat: latitude, lng: longitude };
    try { localStorage.setItem('northstar_last_location', JSON.stringify({ lat: latitude, lng: longitude, at: Date.now() })); } catch (_) {}

    if (userLocationMarker) map.removeLayer(userLocationMarker);
    if (userRadiusCircle) map.removeLayer(userRadiusCircle);

    const radiusMeters = effectiveRadiusMiles * 1609.34;

    userRadiusCircle = L.circle([latitude, longitude], {
      radius: radiusMeters,
      color: '#111111',
      fillColor: '#111111',
      className: 'ns-ink-line',
      fillOpacity: 0.03,
      opacity: 0.3,
      weight: 1.5,
      dashArray: '4, 6',
      interactive: false
    }).addTo(map);

    const blueDotIcon = L.divIcon({
      className: 'user-blue-dot-marker ns-pin',
      html: '<div class="rm-me" aria-label="You are here"><span></span></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    userLocationMarker = L.marker([latitude, longitude], { icon: blueDotIcon, zIndexOffset: 1000, title: 'You are here', alt: 'You are here' }).addTo(map);
    userLocationMarker.bindTooltip('You are here', { direction: 'top', offset: [0, -10] });

    // Auto-fit around the radius circle, unless a search or a focused place is showing: then keep it in view
    const keepForSearch = !!mapSearchQuery && !_centerOnMeRequested;
    const keepForFocus = !!focusedPlaceId && !_centerOnMeRequested;
    const keepResults = keepForSearch || keepForFocus;
    _centerOnMeRequested = false;
    if (keepForSearch) {
      _fitOnNextSearch = true;
    } else if (!keepForFocus && map && typeof map.fitBounds === 'function' && userRadiusCircle) {
      map.fitBounds(userRadiusCircle.getBounds(), Object.assign({ animate: true }, mapFitPadding()));
    }

    updateVisiblePlaces();
    return !keepResults;
  }

  // Set when the person taps "Show my location" (always re-centers, even during a search)
  let _centerOnMeRequested = false;

  function locateAndCenterUser() {
    if (!navigator.geolocation) {
      renderBlueDot(47.6062, -122.3321);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        const dist = calculateDistanceMiles(latitude, longitude, 47.6062, -122.3321);
        // If user is outside Puget Sound / Seattle (>60 mi away), anchor to Seattle mock cluster
        if (dist > 60) {
          renderBlueDot(47.6062, -122.3321);
        } else if (renderBlueDot(latitude, longitude) !== false && userRadiusCircle) {
          // Show the whole search circle (it may have widened to 10 or 25 mi)
          map.fitBounds(userRadiusCircle.getBounds(), Object.assign({ animate: true }, mapFitPadding()));
        }
      },
      (err) => {
        renderBlueDot(47.6062, -122.3321);
      },
      { enableHighAccuracy: true, timeout: 5000 }
    );
  }

  function toggleCategoryFilter(cat) {

  function filterPlacesByRadius(places, selectedRadius) {
    const refCoords = getActiveReferenceCoords();
    const threshold = Number(selectedRadius) || activeRadiusMiles || 5;

    return (places || [])
      .map(place => {
        const dist = calculateDistanceMiles(refCoords.lat, refCoords.lng, place.lat, place.lng);
        return { ...place, distanceMiles: dist };
      })
      .filter(place => place.distanceMiles <= threshold);
  }
  window.filterPlacesByRadius = filterPlacesByRadius;

  // Helper: Dynamic Google Maps / Places API compatible "Open Now" evaluator
  function isPlaceOpenNow(place, targetDate = new Date()) {
    if (!place) return false;
    if (place.closedNote) return false;
    if (Array.isArray(place.categories)) return placeStatus(place, targetDate).open === true;

    // 1. Explicit closed flag (Google Places / Supabase / cached state)
    if (place.open_status === 'CLOSED_FOR_REST_OF_TODAY' || place.open_status === 'CLOSED') {
      return false;
    }

    // 2. Explicit status text indicating Closed (e.g. "Closed · Opens 9:00 AM Mon", "Closed • Holiday")
    if (typeof place.status === 'string') {
      const s = place.status.trim().toLowerCase();
      if (s.startsWith('closed') || s.includes('• closed') || s.includes('closed •') || s.includes('closed ·') || s.includes('closed.')) {
        return false;
      }
    }

    // 3. Explicit 24/7 locations (e.g. The Sophia Way - Helen's Place)
    if (place.is24Seven === true) return true;

    const currentDay = targetDate.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
    const currentHours = targetDate.getHours();
    const currentMins = targetDate.getMinutes();
    const currentTotalMin = currentHours * 60 + currentMins;
    const currentTimeStr = `${String(currentHours).padStart(2, '0')}${String(currentMins).padStart(2, '0')}`;

    // 4. Explicit closed days list (e.g. [0, 6] for weekends)
    if (Array.isArray(place.daysClosed) && place.daysClosed.includes(currentDay)) {
      return false;
    }

    // 5. Structured Google Places API opening_hours object (highest fidelity)
    if (place.opening_hours) {
      if (place.opening_hours.open_now === false && (!Array.isArray(place.opening_hours.periods) || place.opening_hours.periods.length === 0)) {
        return false;
      }

      if (Array.isArray(place.opening_hours.periods) && place.opening_hours.periods.length > 0) {
        const matchingPeriod = place.opening_hours.periods.find(p => {
          if (!p.open) return false;
          // 24/7 period: open on day 0 with time "0000" and no close
          if (p.open.day === 0 && p.open.time === '0000' && !p.close) return true;
          if (p.open.day !== currentDay) return false;
          if (!p.close) return true;

          const openTime = parseInt(p.open.time, 10);
          const closeTime = parseInt(p.close.time, 10);
          const currTimeNum = parseInt(currentTimeStr, 10);

          if (closeTime >= openTime) {
            return currTimeNum >= openTime && currTimeNum <= closeTime;
          } else {
            // Spans past midnight
            return currTimeNum >= openTime || currTimeNum <= closeTime;
          }
        });

        if (matchingPeriod) return true;
        // If structured periods exist and none matched for the requested day/time, place is closed
        return false;
      }
    }

    // 6. Daily hours range (HH:mm - HH:mm)
    if (place.hoursOpen && place.hoursClose) {
      const [oH, oM] = place.hoursOpen.split(':').map(Number);
      const [cH, cM] = place.hoursClose.split(':').map(Number);
      const openMin = oH * 60 + oM;
      const closeMin = cH * 60 + cM;
      return currentTotalMin >= openMin && currentTotalMin <= closeMin;
    }

    // 7. Explicit Google Places / Supabase open_status flag
    if (place.open_status === 'OPEN_NOW') return true;

    // 8. Fallback to status text
    if (typeof place.status === 'string') {
      const s = place.status.toLowerCase();
      if (s.includes('open 24') || s.includes('24/7') || s.startsWith('open') || s.includes('• open') || s.includes('open •') || s.includes('open ·')) {
        return true;
      }
    }

    return false;
  }
  window.isPlaceOpenNow = isPlaceOpenNow;

  // REAL COMBINED MULTI-FILTER FUNCTION (INTERSECTING AND LOGIC)
  // Free-text search from the top bar or ?q= (plain words map to categories)
  let mapSearchQuery = '';
  const SEARCH_SYNONYMS = {
    shelter: 'bed beds shelter sleep stay night',
    food: 'food meal meals eat pantry lunch dinner breakfast',
    restroom: 'shower showers restroom bathroom toilet hygiene laundry',
    wifi: 'wifi wi-fi internet library computer',
    charging: 'charge charging power outlet phone',
    work: 'work job jobs gig gigs labor',
    daycenter: 'day center drop-in daytime warm laundry lockers computer phone mail'
  };
  const SEARCH_STOP_WORDS = ['near', 'me', 'nearby', 'a', 'an', 'the', 'for', 'in', 'to', 'i', 'need', 'find', 'where', 'is', 'can', 'get', 'some', 'place', 'places', 'open', 'now', 'today', 'tonight'];
  function searchWords() {
    return mapSearchQuery.toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/)
      .filter(w => w && !SEARCH_STOP_WORDS.includes(w));
  }
  function matchesMapSearch(pin) {
    if (!mapSearchQuery) return true;
    const cats = Array.isArray(pin.categories) && pin.categories.length ? pin.categories : [pin.category];
    const hay = [pin.name, pin.status, pin.details, pin.description, pin.address, pin.notes, pin.population, pin.hours,
      (pin.tags || []).join(' ').replace(/_/g, ' '), ...cats.map(c => SEARCH_SYNONYMS[c] || c)]
      .join(' ').toLowerCase();
    const words = searchWords();
    if (!words.length) return true;
    // every word must match; "showers" also matches "shower", "meals" matches "meal"
    return words.every(w => hay.includes(w) || (w.length > 3 && w.endsWith('s') && hay.includes(w.slice(0, -1))));
  }

  let _mapSearchTimer = null;
  let _fitOnNextSearch = false;
  function runMapSearch(value) {
    mapSearchQuery = String(value || '').trim();
    const clearBtn = document.getElementById('map-search-clear');
    if (clearBtn) clearBtn.classList.toggle('hidden', !mapSearchQuery);
    _fitOnNextSearch = !!mapSearchQuery;
    if (typeof applyCombinedFilters === 'function') applyCombinedFilters();
  }
  function setMapSearch(value, immediate) {
    clearTimeout(_mapSearchTimer);
    if (immediate) runMapSearch(value);
    else _mapSearchTimer = setTimeout(() => runMapSearch(value), 220);
  }
  window.setMapSearch = setMapSearch;

  window.clearMapSearch = function () {
    const input = document.getElementById('map-search-input');
    if (input) input.value = '';
    setMapSearch('', true);
  };

  // Show every search result on screen
  function fitMapToResults(items) {
    if (!map || !items || !items.length) return;
    const pts = items.filter(p => typeof p.lat === 'number' && typeof p.lng === 'number').map(p => [p.lat, p.lng]);
    if (!pts.length) return;
    const pad = mapFitPadding();
    if (pts.length === 1) map.flyTo(pts[0], Math.max(map.getZoom(), 14), { duration: 0.6 });
    else map.flyToBounds(L.latLngBounds(pts), { ...pad, maxZoom: 15, duration: 0.6 });
  }

  // Back: to wherever the person came from inside the app, else Home
  function rmBack() {
    const fromApp = document.referrer && document.referrer.startsWith(window.location.origin);
    if (fromApp && window.history.length > 1) window.history.back();
    else nsGo(getRole() === 'volunteer' ? 'helper-dashboard.html' : 'seeker-dashboard.html');
  }
  window.rmBack = rmBack;

  function applyCombinedFilters() {
    const resources = getResourcesData();
    const savedIds = getSavedPlaceIds();

    // 1. Filter by category, scope, open-now time, and top Saved/Nearby mode
    const baseMatchingPins = resources.filter(pin => {
      // Top Saved mode match
      if (activeMapMode === 'saved') {
        if (!savedIds.includes(pin.id)) {
          return false;
        }
      }

      // While searching, look across everything: the words decide, not the chips or toggles
      const searching = !!mapSearchQuery;

      // Category Match
      const matchesCategory = searching || activeSelectedCategories.includes('all') || placeInCategories(pin, activeSelectedCategories);

      // Verified Scope Match
      let matchesScope = true;
      if (activeScopeFilter === 'verified' && !searching) {
        matchesScope = (pin.verifiedOnly === true);
      }

      // Dynamic "Open Now" Real-Time Hours Status Check
      let matchesOpenNow = true;
      if (isOpenNowFilterActive && !searching) {
        matchesOpenNow = isPlaceOpenNow(pin) || (pin.hoursKnown === false && !pin.closedNote);
      }

      return matchesCategory && matchesScope && matchesOpenNow && matchesMapSearch(pin);
    });

    // 2. Radius distance filtering:
    // In 'nearby' mode, enforce strict radius distance threshold.
    // In 'saved' mode, prioritize showing the user's bookmarked places while calculating their distance.
    // If the person hasn't picked a distance, widen it until enough places show up.
    const prevEffectiveRadius = effectiveRadiusMiles;
    effectiveRadiusMiles = activeRadiusMiles;
    let radiusPins = [];
    if (activeMapMode !== 'saved') {
      const pinned = baseMatchingPins.filter(hasPin);
      radiusPins = filterPlacesByRadius(pinned, mapSearchQuery ? 500 : effectiveRadiusMiles);
      if (!mapSearchQuery && !radiusChosenByUser) {
        for (const wider of [10, 25]) {
          if (radiusPins.length >= MIN_NEARBY_PLACES) break;
          if (wider <= effectiveRadiusMiles) continue;
          effectiveRadiusMiles = wider;
          radiusPins = filterPlacesByRadius(pinned, wider);
        }
      }
      // A place the person tapped or deep-linked stays on the map even if it sits outside the radius
      if (focusedPlaceId && !radiusPins.some(p => String(p.id) === String(focusedPlaceId))) {
        const keep = pinned.find(p => String(p.id) === String(focusedPlaceId));
        if (keep) {
          const refCoords = getActiveReferenceCoords();
          radiusPins = [...radiusPins, { ...keep, distanceMiles: calculateDistanceMiles(refCoords.lat, refCoords.lng, keep.lat, keep.lng) }];
        }
      }
      if (userRadiusCircle && effectiveRadiusMiles !== prevEffectiveRadius) {
        userRadiusCircle.setRadius(effectiveRadiusMiles * 1609.34);
        if (map && typeof map.fitBounds === 'function') {
          map.fitBounds(userRadiusCircle.getBounds(), Object.assign({ animate: true }, mapFitPadding()));
        }
      }
    }

    const filteredPins = (activeMapMode === 'saved')
      ? baseMatchingPins.map(place => {
          const refCoords = getActiveReferenceCoords();
          const dist = hasPin(place) ? calculateDistanceMiles(refCoords.lat, refCoords.lng, place.lat, place.lng) : NaN;
          return { ...place, distanceMiles: dist };
        })
      : [
          ...radiusPins,
          ...baseMatchingPins.filter(p => !hasPin(p)).map(p => ({ ...p, distanceMiles: NaN }))
        ];

    lastFilteredCount = filteredPins.length;
    currentFocusId = resolveFocusId(filteredPins);
    if (!currentFocusId) focusedPlaceId = null;
    renderLeafletMarkers(filteredPins);
    renderDrawerPlaces(filteredPins);
    syncFilterSummary();
    if (_fitOnNextSearch) {
      _fitOnNextSearch = false;
      fitMapToResults(filteredPins);
      if (typeof snapPlacesSheet === 'function') {
        snapPlacesSheet(filteredPins.length === 0 || currentFocusId ? 'half' : 'peek');
      }
    } else if (typeof snapPlacesSheet === 'function' && placesSheet.state !== 'full') {
      snapPlacesSheet(filteredPins.length === 0 || currentFocusId ? 'half' : 'peek');
    }
  }

  // The bottom sheet only focuses a place when the person explicitly tapped one (or deep-linked via ?resource=)
  function resolveFocusId(items) {
    if (!items || !items.length || !focusedPlaceId) return null;
    return items.some(p => String(p.id) === String(focusedPlaceId)) ? String(focusedPlaceId) : null;
  }

  function updateVisiblePlaces() {

  window.updateVisiblePlaces = updateVisiblePlaces;

  function renderLeafletMarkers(items) {
    if (!map) return;
    mapMarkers.forEach(m => map.removeLayer(m.marker));
    mapMarkers = [];

    const savedIds = getSavedPlaceIds();

    items.filter(hasPin).forEach(res => {
      const meta = categoryMeta(res.category);
      const isFocus = currentFocusId !== null && String(res.id) === currentFocusId;
      const isSaved = savedIds.includes(res.id);
      const customIcon = isFocus
        ? L.divIcon({
            className: 'custom-leaflet-pin ns-pin',

            iconSize: [0, 0],
            iconAnchor: [0, 0]
          })
        : L.divIcon({
            className: 'custom-leaflet-pin ns-pin',
            html: `<div class="rm-pin${isSaved ? ' rm-pin--saved' : ''}${placeStatus(res).open === false ? ' rm-pin--closed' : ''}"><span class="material-symbols-outlined" aria-hidden="true">${meta.icon}</span><span class="sr-only">${esc(res.name)}</span></div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18]
          });

      const marker = L.marker([res.pinLat || res.lat, res.pinLng || res.lng], {
        icon: customIcon,
        title: res.name,
        keyboard: true,
        zIndexOffset: isFocus ? 900 : 0
      }).addTo(map);

      marker.on('click', () => focusPlaceInSheet(res.id));
      mapMarkers.push({ resId: res.id, marker: marker, data: res });
    });

    // If chatbot/navigation supplied ?resource=<id>, wait until
    // all markers exist, then focus and open that exact resource.
    if (new URLSearchParams(window.location.search).get('resource')) {
      setTimeout(() => {
        focusResourceFromUrl();
      }, 500);
    }

  }

  function handleCreateResource(e) {

  // RADIUS MODIFIER LOGIC
  function setSearchRadius(miles) {
    activeRadiusMiles = miles;
    effectiveRadiusMiles = miles;
    radiusChosenByUser = true;
    
    [5, 10, 25].forEach(m => {
      const btn = document.getElementById(`radius-btn-${m}`);
      setPressed(btn, m === miles);
    });

    if (userRadiusCircle) {
      userRadiusCircle.setRadius(miles * 1609.34);

        map.fitBounds(userRadiusCircle.getBounds(), Object.assign({ animate: true }, mapFitPadding()));
      }
