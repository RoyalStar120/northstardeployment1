<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0.9, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Progress · Northstar</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="js/ns-boot.js"></script>
<script src="js/user-data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/app.css">
<style>
    .me-top { display: flex; justify-content: flex-end; padding: max(8px, env(safe-area-inset-top)) 8px 0; }
    .me-avatar {
        width: 88px; height: 88px; border-radius: 50%;
        background: var(--amber);
        border: 2px solid var(--ink);
        display: grid; place-items: center;
        font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink);
    }
    .me-name { margin-top: 12px; font-size: 25px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em; }
    .me-skills { display: flex; flex-wrap: wrap; gap: 8px; }
    .me-row__value { font-size: 15px; font-weight: 500; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>

<div class="app-frame">

    <main class="ns-main !p-0 progress-scroll-container">
        <div class="me-top">
            <button type="button" class="ns-icon-btn ns-icon-btn--bare" onclick="openSettingsModal()" aria-label="Open settings">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </div>

        <section class="flex flex-col items-center text-center px-4">
            <div id="me-avatar" class="me-avatar ns-on-amber" aria-hidden="true">N</div>
            <h1 id="me-name" class="me-name">Welcome</h1>
            <p id="me-handle" class="text-[15px] font-medium text-muted mt-1">Using Northstar without an account</p>
        </section>

        <div class="px-4 pb-8">

            <!-- Resume (seekers) -->
            <a id="me-resume-card" href="resume-builder.html" class="ns-card block p-4 mt-5">
                <span class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-[22px]" aria-hidden="true">auto_awesome</span>
                    <span class="flex-1 text-[16px] font-bold">Resume</span>
                    <span id="me-resume-pct" class="text-[16px] font-bold">0%</span>
                </span>
                <span class="ns-progress block mt-3"><span id="me-resume-bar" style="width: 0%"></span></span>
                <span id="me-resume-status" class="block text-[13px] text-muted mt-2">5 short questions</span>
            </a>

            <!-- Skills from the saved resume -->
            <div id="me-skills" class="me-skills mt-4"></div>

            <!-- Rows -->
            <div class="ns-list mt-4">
                <a id="me-steps-row" href="#first-steps" class="ns-row" onclick="event.preventDefault(); document.getElementById('first-steps').scrollIntoView({ behavior: 'smooth' });">
                    <span class="material-symbols-outlined text-[22px]" aria-hidden="true">flag</span>
                    <span class="ns-row__body ns-row__title !font-medium">First steps</span>
                    <span id="journey-progress-text" class="me-row__value">0 of 5 done</span>
                    <span class="material-symbols-outlined ns-chevron">chevron_right</span>
                </a>
                <button type="button" class="ns-row" onclick="openSettingsModal()">
                    <span class="material-symbols-outlined text-[22px]" aria-hidden="true">swap_horiz</span>
                    <span class="ns-row__body ns-row__title !font-medium">Using Northstar to</span>
                    <span id="me-role-value" class="me-row__value">Find help</span>
                    <span class="material-symbols-outlined ns-chevron">chevron_right</span>
                </button>
                <a href="call-shelter.html" class="ns-row">
                    <span class="material-symbols-outlined text-[22px]" aria-hidden="true">call</span>
                    <span class="ns-row__body ns-row__title !font-medium">Call for help</span>
                    <span class="me-row__value">211</span>
                    <span class="material-symbols-outlined ns-chevron">chevron_right</span>
                </a>
                <button id="switch-account-btn" type="button" class="ns-row" onclick="if (typeof window.nsClearSession === 'function') window.nsClearSession(); else { localStorage.removeItem('northstar_session'); localStorage.removeItem('northstar_user_role'); } nsGo('index.html');">
                    <span class="material-symbols-outlined text-[22px]" aria-hidden="true">logout</span>
                    <span id="me-account-action" class="ns-row__body ns-row__title !font-medium">Sign out</span>
                    <span id="progress-account-label" class="me-row__value truncate max-w-[45%]"></span>
                    <span class="material-symbols-outlined ns-chevron">chevron_right</span>
                </button>
            </div>

            <!-- Your history (helpers only; js/volunteer-history.js fills it) -->
            <section id="volunteer-history-section" class="hidden">
                <div class="ns-section-head" style="display:flex;align-items:center;justify-content:space-between;">
                    <h2>Your history</h2>
                    <button id="history-see-all" type="button" class="ns-link hidden" style="font-size:13px;" onclick="openHistorySheet()">See all</button>
                </div>
                <div id="volunteer-history-recent">
                    <div class="ns-empty"><p class="ns-empty__title">Loading your history…</p></div>
                </div>
            </section>

            <!-- First steps (progress list, real milestones from js/northstar.js) -->
            <section id="first-steps">
                <div class="ns-section-head">
                    <h2>First steps</h2>
                    <span id="journey-pct-badge" class="ns-aside">0%</span>
                </div>
                <div id="stepper-nodes" class="flex gap-1.5" aria-hidden="true"></div>
                <div class="hidden"><span id="journey-progress-bar"></span></div>
                <div id="journey-list-container" class="ns-list mt-2"></div>
            </section>
        </div>
    </main>

    <nav class="bottom-nav ns-nav" aria-label="Main"></nav>
</div>

<script src="js/northstar.js"></script>
<script src="js/volunteer-history.js"></script>
<script>
(function () {
    const esc = s => (window.nsEscape ? nsEscape(s) : String(s == null ? '' : s));

    function savedResume() {
        try {
            const raw = JSON.parse(localStorage.getItem('northstar_latest_resume_data') || 'null');
            if (raw && typeof raw === 'object') return raw;
        } catch (e) {}
        try {
            const data = getUserData();
            if (data && data.resumeData) return data.resumeData;
        } catch (e) {}
        return null;
    }

    function renderProfile() {
        const session = typeof getSession === 'function' ? getSession() : { isGuest: true };
        const name = typeof nsDisplayName === 'function' ? nsDisplayName() : '';
        const isGuest = !session || session.isGuest;
        const role = typeof getRole === 'function' ? getRole() : 'seeker';
        const isVolunteer = role === 'volunteer';
        document.title = isVolunteer ? 'Me · Northstar' : 'Progress · Northstar';

        document.getElementById('me-avatar').textContent = isGuest || !name
            ? 'N'
            : name.split(/\s+/).map(p => p.charAt(0)).join('').slice(0, 2).toUpperCase();
        document.getElementById('me-name').textContent = isGuest ? 'Welcome' : (name || 'Your account');

        const handle = !isGuest && session.username ? `@${String(session.username).toLowerCase().replace(/\s+/g, '')}` : '';
        document.getElementById('me-handle').textContent = isGuest
            ? 'Using Northstar without an account'
            : [handle, isVolunteer ? 'Volunteer' : 'Finding help'].filter(Boolean).join(' · ');

        document.getElementById('me-role-value').textContent = isVolunteer ? 'Give help' : 'Find help';
        const action = document.getElementById('me-account-action');
        if (action) action.textContent = isGuest ? 'Sign in or create an account' : 'Sign out';

        // Resume card + skills are for people finding work; volunteers don't use the resume builder
        const card = document.getElementById('me-resume-card');
        const skillsEl = document.getElementById('me-skills');
        const stepsSection = document.getElementById('first-steps');
        const stepsRow = document.getElementById('me-steps-row');
        if (isVolunteer) {
            card.classList.add('hidden');
            skillsEl.classList.add('hidden');
            stepsSection.classList.add('hidden');
            stepsRow.classList.add('hidden');
            return;
        }

        const resume = savedResume();
        const ready = !!resume || localStorage.getItem('northstar_resume_saved') === 'true';
        document.getElementById('me-resume-pct').textContent = ready ? '100%' : '0%';
        document.getElementById('me-resume-bar').style.width = ready ? '100%' : '0%';
        document.getElementById('me-resume-status').textContent = ready ? 'Ready to print or share' : 'Not started · 5 short questions';

        const skills = [];
        if (resume && resume.skills) {
            ['certifications', 'practical_skills', 'core_strengths'].forEach(k => {
                (resume.skills[k] || []).forEach(v => { if (v && skills.length < 4 && !skills.includes(v)) skills.push(v); });
            });
        }
        skillsEl.innerHTML = skills.map((s, i) =>
            `<a href="resume-builder.html" class="ns-chip${i === 0 ? ' is-active' : ''}">${esc(s)}</a>`
        ).join('') + `<a href="resume-builder.html" class="ns-chip"><span class="material-symbols-outlined">add</span>${skills.length ? 'Add skill' : 'Add your skills'}</a>`;
    }

    window.addEventListener('ns:userdata', e => { e.preventDefault(); renderProfile(); if (typeof renderProgressPage === 'function') renderProgressPage(); });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderProfile);
    else renderProfile();
})();
</script>
<script src="js/jobs.js"></script>
</body>
</html>
